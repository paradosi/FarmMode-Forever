<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- FarmMode Forever logo: a gathering minimap (route, herb and ore nodes, the player
       arrow) in a gold ring, on a dark tile with FarmMode's blue "enlarge" corners.
       Source for media/art/logo_400.png, logo_64.png and media/textures/logo.tga. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16222f"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <radialGradient id="land" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#7fa55a"/>
      <stop offset="0.55" stop-color="#557a3c"/>
      <stop offset="1" stop-color="#2f4a24"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3ad"/>
      <stop offset="0.45" stop-color="#e3b664"/>
      <stop offset="1" stop-color="#8f6428"/>
    </linearGradient>
    <linearGradient id="ore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.5" stop-color="#d9893a"/>
      <stop offset="1" stop-color="#7a4214"/>
    </linearGradient>
    <radialGradient id="glowY" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="200" cy="200" r="132"/></clipPath>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="384" height="384" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="384" height="384" rx="56" fill="none" stroke="#2a3a4c" stroke-width="4"/>

  <!-- enlarge corners -->
  <g fill="none" stroke="#00b3ff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 104 V40 H104"/>
    <path d="M296 40 H360 V104"/>
    <path d="M360 296 V360 H296"/>
    <path d="M104 360 H40 V296"/>
  </g>

  <!-- map -->
  <g clip-path="url(#disc)">
    <rect x="60" y="60" width="280" height="280" fill="url(#land)"/>
    <!-- forest -->
    <g fill="#2c4a22" opacity="0.8">
      <circle cx="110" cy="250" r="38"/><circle cx="140" cy="285" r="30"/>
      <circle cx="290" cy="120" r="34"/><circle cx="262" cy="96" r="24"/>
    </g>
    <!-- river -->
    <path d="M330 210 C290 230 270 280 300 340" fill="none" stroke="#3f86b8" stroke-width="16" stroke-linecap="round"/>
    <path d="M330 210 C290 230 270 280 300 340" fill="none" stroke="#7cc3e8" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    <!-- gathering route -->
    <path d="M130 154 C158 114 190 130 200 200 S 250 270 282 248" fill="none" stroke="#f2e6c4" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 16" opacity="0.95"/>
    <rect x="60" y="60" width="280" height="280" fill="url(#vignette)"/>
  </g>

  <!-- herb node -->
  <circle cx="130" cy="154" r="44" fill="url(#glowY)"/>
  <g transform="translate(130 156) scale(1.35)">
    <path d="M0 18 C0 6 0 -4 0 -10" stroke="#2d5a1a" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M0 -4 C-20 -6 -24 -22 -18 -28 C-6 -26 2 -16 0 -4 Z" fill="#a8e05a" stroke="#2d5a1a" stroke-width="3.5"/>
    <path d="M0 2 C18 2 24 -12 20 -20 C8 -20 -1 -10 0 2 Z" fill="#c9f07a" stroke="#2d5a1a" stroke-width="3.5"/>
  </g>

  <!-- ore node -->
  <circle cx="282" cy="248" r="44" fill="url(#glowY)"/>
  <g transform="translate(282 248) scale(1.3)">
    <path d="M-20 10 L-14 -12 L4 -20 L20 -6 L16 14 L-4 20 Z" fill="url(#ore)" stroke="#4a2608" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-14 -12 L-2 -2 L4 -20 M-2 -2 L16 14 M-2 -2 L-20 10" stroke="#4a2608" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- player arrow -->
  <g transform="translate(200 200) rotate(35)">
    <path d="M0 -30 L20 24 L0 12 L-20 24 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -30 L0 12 L-20 24 Z" fill="#d8d8d8"/>
  </g>

  <!-- gold ring -->
  <circle cx="200" cy="200" r="138" fill="none" stroke="#3a2a10" stroke-width="20"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="url(#gold)" stroke-width="13"/>
  <circle cx="200" cy="200" r="131" fill="none" stroke="#000" stroke-width="2" opacity="0.5"/>
</svg>
